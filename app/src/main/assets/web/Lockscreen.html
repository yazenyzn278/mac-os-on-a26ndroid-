<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>macOS Lockscreen</title>
    <style>
        @font-face {
            font-family: 'SFProText-Semibold';
            src: url('./fonts/SFProText-Bold.ttf') format('truetype');
            font-weight: 600;
            font-style: normal;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'SFProText-Semibold', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            /* Fondo estático de Tahoe */
            background-image: url('./background/TahoeDay.jpg');
            background-size: cover;
            background-position: center;
        }
        .top-bar {
            display: flex;
            justify-content: flex-end;
            width: 100%;
            padding: 10px;
            color: #fff;
            box-sizing: border-box;
        }
        .top-bar span {
            font-size: 0.7em; 
            margin-right: 20px;
        }
        .date-time {
            text-align: center;
            color: #fff;
            font-size: 3em;
            font-weight: bold;
            margin-top: 10vh; /* Esto lo mantiene siempre a la misma distancia arriba */
        }
        .clock {
            font-family: 'SFProText-Semibold';
            color: rgba(255, 255, 255, 0.70);
            transform: scale(1.8); /* Tu escala original */
            margin-top: 20px;
        }
        .date {
            font-size: 0.5em;
            opacity: 0.7;
        }
        .password-box {
            margin-top: auto;
            margin-bottom: 10vh; /* Esto lo mantiene siempre a la misma distancia abajo */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .user-info {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .user-info img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 10px;
        }
        .user-label {
            color: white;
            font-size: 0.7em; 
            margin-bottom: 15px;
        }
        .password-box input {
            padding: 5px;
            /* Ancho fijo estricto de 150px */
            width: 150px;
            min-width: 150px;
            max-width: 150px;
            /* --------------------------- */
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(6px);
            color: white;
            text-align: center;
            box-sizing: border-box;
        }
        input#password::placeholder {
            color: rgba(255, 255, 255, 0.50);
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <span>U.S. ⌨ 🔋</span>
    </div>
    <div class="date-time">
        <div class="date">Friday, October 10</div>
        <div id="time" class="clock">12:34</div>
    </div>
    <div class="password-box">
        <div class="user-info">
            <img src="./icon/user-avatar.png" alt="User">
            <span class="user-label">Sunstar_16</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
            <input type="password" id="password" placeholder="Password: 1234" value="1234">
            <button onclick="checkPassword()" style="background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);border-radius:6px;color:#fff;padding:6px 12px;cursor:pointer;font-size:12px;">Unlock ➜</button>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            document.querySelector('.date').textContent = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
            document.getElementById('time').textContent = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        }
        function checkPassword() {
            if (document.getElementById('password').value === '1234' || document.getElementById('password').value === '') {
                window.location.href = './index.html';
            } else {
                alert('Incorrect password.');
            }
        }
        setInterval(updateTime, 60000);
        updateTime();
        document.getElementById('password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
